<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="战魂小助手"
>
  <!-- 原创简笔「咸鱼」favicon：纯几何路径自绘，不使用任何游戏官方美术 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#FFF8F0" />
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="18"
    fill="none"
    stroke="#FF8FB1"
    stroke-opacity="0.35"
    stroke-width="2"
  />

  <g
    stroke="#4A3B45"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- 尾巴 -->
    <path d="M43 33 L57 24 Q59.5 33 57 42 Z" fill="#A5C9FF" />
    <!-- 背鳍 -->
    <path d="M27 23.5 Q32 15 38 22.5 Z" fill="#A8E6CF" />
    <!-- 鱼身 -->
    <ellipse
      cx="29"
      cy="33"
      rx="17"
      ry="11"
      transform="rotate(-8 29 33)"
      fill="#A5C9FF"
    />
    <!-- 胸鳍 -->
    <path d="M31 38.5 Q26.5 44.5 21.5 42" />
    <!-- 嘴巴 -->
    <path d="M12.2 34.5 Q15 37.5 18.2 36.2" />
  </g>

  <!-- 眼睛 -->
  <circle cx="18.6" cy="30.4" r="2.3" fill="#4A3B45" />
  <circle cx="17.8" cy="29.5" r="0.75" fill="#FFFFFF" />

  <!-- 腮红 -->
  <ellipse
    cx="15.4"
    cy="38.2"
    rx="2.7"
    ry="2"
    fill="#FF8FB1"
    opacity="0.55"
  />

  <!-- 泡泡 -->
  <circle cx="7.6" cy="21" r="1.7" fill="#A8E6CF" opacity="0.9" />
  <circle cx="9.4" cy="14.4" r="1.1" fill="#A8E6CF" opacity="0.7" />

  <!-- 小星星 -->
  <path
    d="M48.5 9.5 L50.1 13.9 L54.5 15.5 L50.1 17.1 L48.5 21.5 L46.9 17.1 L42.5 15.5 L46.9 13.9 Z"
    fill="#FFEAA7"
    stroke="#FFC966"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>
